<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="studio-token" content="__STUDIO_TOKEN__">
<title>APK Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 21l5-10 3 6 2-4 4 8z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" aria-hidden="true"></span><span>APK Studio</span><small>복제 · 업그레이드 대시보드</small></div>
  <button id="envPill" class="pill" type="button">도구 확인 중…</button>
</header>

<div class="layout">
  <aside class="sidebar" aria-label="프로젝트">
    <div class="side-head">
      <h2>프로젝트</h2>
      <button id="btnNew" class="btn small primary" type="button">＋ 새 프로젝트</button>
    </div>
    <ul id="projectList" class="project-list"></ul>
  </aside>

  <main id="main" class="main" aria-live="polite"></main>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="/app.js"></script>
</body>
</html>
