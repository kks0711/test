<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성경 블럭 왕국 - 퀴즈 풀고 블럭 쌓기!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --sky-top: #7ec8f7;
    --sky-bottom: #cdeeff;
    --panel: #fffdf5;
    --brown: #8d6e4b;
    --brown-dark: #6b4f33;
    --green: #58c94e;
    --green-dark: #3fa236;
    --gold: #ffcc33;
    --red: #ff6b6b;
    --blue: #4da3ff;
    --text: #4a3423;
  }

  html, body { height: 100%; }

  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
    color: var(--text);
    overflow: hidden;
    user-select: none;
  }

  /* ===== 상단 바 ===== */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 64px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px;
    background: rgba(255, 253, 245, .92);
    border-bottom: 4px solid var(--brown);
    z-index: 20;
  }
  #topbar h1 {
    font-size: 20px; color: var(--brown-dark);
    text-shadow: 1px 1px 0 #fff;
    margin-right: auto;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #coinBox {
    display: flex; align-items: center; gap: 6px;
    background: #fff3c4; border: 3px solid var(--gold);
    border-radius: 999px; padding: 6px 16px;
    font-size: 20px; font-weight: 800; color: #9c6b00;
    box-shadow: 0 2px 0 #d8a800;
  }
  #coinBox.bump { animation: bump .35s ease; }
  @keyframes bump { 40% { transform: scale(1.25); } }

  .btn {
    border: none; cursor: pointer;
    font-family: inherit; font-weight: 800;
    border-radius: 14px; color: #fff;
    padding: 10px 18px; font-size: 16px;
    transition: transform .08s ease, filter .12s ease;
  }
  .btn:active { transform: translateY(2px); }
  .btn:hover { filter: brightness(1.08); }
  .btn-quiz { background: var(--green); box-shadow: 0 4px 0 var(--green-dark); font-size: 18px; }
  .btn-help { background: var(--blue); box-shadow: 0 4px 0 #2b7dd6; }
  .btn-reset { background: #b9a58c; box-shadow: 0 4px 0 #8f7d66; font-size: 13px; padding: 8px 12px; }

  /* ===== 게임 화면 ===== */
  #gameWrap {
    position: fixed; top: 64px; bottom: 148px; left: 0; right: 0;
  }
  #gameCanvas { width: 100%; height: 100%; display: block; touch-action: manipulation; }

  .cloud {
    position: absolute; background: #fff; border-radius: 999px;
    opacity: .85; pointer-events: none;
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: #fff; border-radius: 50%;
  }
  .cloud::before { width: 60%; height: 160%; left: 12%; top: -70%; }
  .cloud::after { width: 45%; height: 120%; right: 12%; top: -40%; }
  @keyframes drift { from { transform: translateX(-220px); } to { transform: translateX(calc(100vw + 220px)); } }

  /* ===== 모드 버튼 (놓기/부수기) ===== */
  #modeBar {
    position: fixed; right: 14px; top: 80px; z-index: 15;
    display: flex; flex-direction: column; gap: 8px;
  }
  .mode-btn {
    width: 64px; height: 64px; font-size: 26px;
    border-radius: 16px; border: 3px solid var(--brown);
    background: var(--panel); cursor: pointer;
    box-shadow: 0 3px 0 var(--brown-dark);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text); font-family: inherit;
  }
  .mode-btn small { font-size: 11px; font-weight: 800; }
  .mode-btn.active { background: #ffe9a8; border-color: var(--gold); outline: 3px solid #ffb700; }

  /* ===== 하단 블럭 팔레트 ===== */
  #palette {
    position: fixed; bottom: 0; left: 0; right: 0; height: 148px;
    background: rgba(255, 253, 245, .95);
    border-top: 4px solid var(--brown);
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    overflow-x: auto; overflow-y: hidden;
    z-index: 20;
  }
  .block-card {
    flex: 0 0 auto; width: 104px; height: 122px;
    background: #fff; border: 3px solid #d9c9ae;
    border-radius: 14px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    padding: 6px 4px 4px;
    position: relative;
    transition: transform .08s ease;
  }
  .block-card:hover { transform: translateY(-3px); }
  .block-card.selected { border-color: #ffb700; outline: 3px solid var(--gold); background: #fff8dd; }
  .block-card canvas { width: 44px; height: 44px; }
  .block-card .bname { font-size: 13px; font-weight: 800; }
  .block-card .bcount {
    position: absolute; top: 4px; right: 6px;
    background: var(--brown); color: #fff;
    font-size: 12px; font-weight: 800;
    border-radius: 999px; padding: 1px 7px;
  }
  .block-card .bcount.zero { background: #c9c9c9; }
  .buy-btn {
    margin-top: 3px;
    border: none; cursor: pointer; font-family: inherit;
    background: var(--gold); color: #7a5200;
    font-size: 12px; font-weight: 800;
    border-radius: 999px; padding: 4px 10px;
    box-shadow: 0 2px 0 #d8a800;
  }
  .buy-btn:active { transform: translateY(1px); }
  .buy-btn:disabled { background: #e2e2e2; color: #9a9a9a; box-shadow: none; cursor: not-allowed; }

  /* ===== 모달 공통 ===== */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(30, 50, 80, .55);
    display: flex; align-items: center; justify-content: center;
    z-index: 50; padding: 16px;
  }
  .modal {
    background: var(--panel); border: 4px solid var(--brown);
    border-radius: 22px; padding: 24px;
    width: min(520px, 94vw); max-height: 88vh; overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    animation: pop .22s ease;
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  .hidden { display: none !important; }

  /* ===== 퀴즈 모달 ===== */
  #quizTag {
    display: inline-block; background: var(--green); color: #fff;
    font-size: 13px; font-weight: 800;
    border-radius: 999px; padding: 4px 12px; margin-bottom: 10px;
  }
  #quizQuestion { font-size: 21px; font-weight: 800; line-height: 1.45; margin-bottom: 16px; }
  .answers { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .answer-btn {
    border: 3px solid #d9c9ae; background: #fff;
    border-radius: 14px; padding: 13px 14px;
    font-family: inherit; font-size: 17px; font-weight: 700;
    color: var(--text); cursor: pointer; text-align: left;
    transition: transform .08s ease;
  }
  .answer-btn:hover:not(:disabled) { border-color: var(--blue); transform: translateX(4px); }
  .answer-btn.correct { background: #d9f7d0; border-color: var(--green); }
  .answer-btn.wrong { background: #ffe0e0; border-color: var(--red); }
  .answer-btn:disabled { cursor: default; }
  #quizFeedback {
    margin-top: 14px; font-size: 18px; font-weight: 800;
    text-align: center; min-height: 28px;
  }
  #quizVerse { margin-top: 6px; font-size: 14px; color: #8a7355; text-align: center; }
  .modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .btn-next { background: var(--green); box-shadow: 0 4px 0 var(--green-dark); }
  .btn-close { background: #b9a58c; box-shadow: 0 4px 0 #8f7d66; }

  #streakBox { text-align: center; font-size: 14px; color: #c07c00; font-weight: 800; margin-top: 6px; }

  /* ===== 도움말 모달 ===== */
  #helpModal h2 { color: var(--brown-dark); margin-bottom: 12px; font-size: 22px; }
  #helpModal li { margin: 9px 0 9px 22px; font-size: 16px; line-height: 1.5; }
  #helpModal .tip { background: #fff3c4; border-radius: 12px; padding: 10px 14px; margin-top: 12px; font-size: 14px; font-weight: 700; }

  /* ===== 코인 획득 애니메이션 ===== */
  .coin-fly {
    position: fixed; z-index: 60; font-size: 26px; font-weight: 900;
    color: #ffb700; text-shadow: 1px 1px 0 #7a5200;
    pointer-events: none; animation: flyup 1.1s ease forwards;
  }
  @keyframes flyup {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to { opacity: 0; transform: translateY(-90px) scale(1.4); }
  }

  /* ===== 반응형 ===== */
  @media (max-width: 640px) {
    #topbar h1 { font-size: 15px; }
    .btn-quiz { font-size: 14px; padding: 9px 12px; }
    .btn-help, .btn-reset { padding: 9px 10px; font-size: 13px; }
    #coinBox { font-size: 16px; padding: 5px 12px; }
    .mode-btn { width: 54px; height: 54px; font-size: 22px; }
  }
</style>
</head>
<body>

<!-- 상단 바 -->
<div id="topbar">
  <h1>⛪ 성경 블럭 왕국</h1>
  <div id="coinBox">🪙 <span id="coinCount">0</span></div>
  <button class="btn btn-quiz" id="quizOpenBtn">📖 퀴즈 풀고 코인 받기!</button>
  <button class="btn btn-help" id="helpBtn">❓</button>
  <button class="btn btn-reset" id="resetBtn">처음부터</button>
</div>

<!-- 게임 화면 -->
<div id="gameWrap">
  <canvas id="gameCanvas"></canvas>
</div>

<!-- 놓기 / 부수기 모드 -->
<div id="modeBar">
  <button class="mode-btn active" id="placeModeBtn" title="블럭 놓기">🧱<small>놓기</small></button>
  <button class="mode-btn" id="removeModeBtn" title="블럭 부수기">⛏️<small>부수기</small></button>
</div>

<!-- 블럭 팔레트 -->
<div id="palette"></div>

<!-- 퀴즈 모달 -->
<div class="modal-bg hidden" id="quizModal">
  <div class="modal">
    <span id="quizTag">📖 성경 퀴즈</span>
    <div id="quizQuestion"></div>
    <div class="answers" id="quizAnswers"></div>
    <div id="quizFeedback"></div>
    <div id="quizVerse"></div>
    <div id="streakBox"></div>
    <div class="modal-actions">
      <button class="btn btn-next hidden" id="nextQuizBtn">다음 퀴즈 풀기 ➡️</button>
      <button class="btn btn-close" id="closeQuizBtn">그만 풀기</button>
    </div>
  </div>
</div>

<!-- 도움말 모달 -->
<div class="modal-bg hidden" id="helpModal">
  <div class="modal">
    <h2>🎮 게임 방법</h2>
    <ol>
      <li><b>📖 퀴즈 풀고 코인 받기</b> 버튼을 눌러 성경 퀴즈를 풀어요.</li>
      <li>정답을 맞히면 <b>🪙 코인 10개</b>를 받아요! (3문제 연속 정답이면 보너스 🎉)</li>
      <li>아래 상점에서 코인으로 <b>블럭을 사요</b>. (한 번에 5개씩!)</li>
      <li>블럭 카드를 눌러 고른 다음, <b>땅을 클릭</b>해서 블럭을 쌓아요.</li>
      <li>⛏️ <b>부수기</b> 모드에서 블럭을 클릭하면 다시 가방에 돌아와요.</li>
    </ol>
    <div class="tip">💡 나만의 교회, 집, 노아의 방주를 만들어 보세요! 게임은 자동으로 저장돼요.</div>
    <div class="modal-actions">
      <button class="btn btn-next" id="closeHelpBtn">알겠어요!</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   성경 퀴즈 데이터 (어린이용)
   ========================================================= */
const QUIZZES = [
  { q: "하나님이 세상을 만드시는 데 며칠 걸리셨을까요?", a: ["6일", "3일", "10일", "100일"], c: 0, v: "창세기 1장" },
  { q: "하나님이 만드신 첫 번째 사람의 이름은 무엇일까요?", a: ["아담", "노아", "모세", "다윗"], c: 0, v: "창세기 2장" },
  { q: "아담의 아내 이름은 무엇일까요?", a: ["하와", "마리아", "룻", "한나"], c: 0, v: "창세기 3장" },
  { q: "하나님 말씀대로 커다란 배(방주)를 만든 사람은 누구일까요?", a: ["노아", "아브라함", "요셉", "베드로"], c: 0, v: "창세기 6장" },
  { q: "홍수가 끝난 뒤 하나님이 하늘에 보여주신 약속의 표시는 무엇일까요?", a: ["무지개", "번개", "별똥별", "구름"], c: 0, v: "창세기 9장" },
  { q: "믿음의 조상이라고 불리는 사람은 누구일까요?", a: ["아브라함", "가인", "삼손", "요나"], c: 0, v: "창세기 12장" },
  { q: "아브라함이 100살에 얻은 귀한 아들의 이름은 무엇일까요?", a: ["이삭", "야곱", "에서", "요셉"], c: 0, v: "창세기 21장" },
  { q: "형들에게 팔려 애굽(이집트)에 가게 된 사람은 누구일까요?", a: ["요셉", "베냐민", "유다", "르우벤"], c: 0, v: "창세기 37장" },
  { q: "아버지 야곱이 요셉에게 만들어 준 특별한 옷은 무엇일까요?", a: ["채색옷(알록달록한 옷)", "털옷", "갑옷", "임금님 옷"], c: 0, v: "창세기 37장" },
  { q: "이스라엘 백성을 애굽에서 데리고 나온 지도자는 누구일까요?", a: ["모세", "여호수아", "사무엘", "엘리야"], c: 0, v: "출애굽기 3장" },
  { q: "모세가 지팡이를 들자 갈라진 바다는 어디일까요?", a: ["홍해", "지중해", "갈릴리 바다", "사해"], c: 0, v: "출애굽기 14장" },
  { q: "하나님이 모세에게 주신 계명은 모두 몇 개일까요?", a: ["10개", "5개", "7개", "12개"], c: 0, v: "출애굽기 20장" },
  { q: "여리고 성은 어떻게 무너졌을까요?", a: ["나팔을 불고 소리치자 무너졌어요", "대포를 쏘았어요", "비가 많이 왔어요", "바람이 불었어요"], c: 0, v: "여호수아 6장" },
  { q: "거인 골리앗을 물리친 용감한 소년은 누구일까요?", a: ["다윗", "솔로몬", "사울", "요나단"], c: 0, v: "사무엘상 17장" },
  { q: "다윗이 골리앗을 이길 때 사용한 것은 무엇일까요?", a: ["물맷돌", "칼", "창", "활"], c: 0, v: "사무엘상 17장" },
  { q: "하나님께 지혜를 구해서 가장 지혜로운 왕이 된 사람은 누구일까요?", a: ["솔로몬", "다윗", "사울", "히스기야"], c: 0, v: "열왕기상 3장" },
  { q: "사자굴에 들어갔지만 하나님이 지켜주셔서 살아난 사람은 누구일까요?", a: ["다니엘", "요셉", "예레미야", "에스더"], c: 0, v: "다니엘 6장" },
  { q: "큰 물고기 뱃속에서 3일 동안 있었던 사람은 누구일까요?", a: ["요나", "베드로", "바울", "노아"], c: 0, v: "요나 1~2장" },
  { q: "예수님이 태어나신 마을은 어디일까요?", a: ["베들레헴", "예루살렘", "나사렛", "여리고"], c: 0, v: "누가복음 2장" },
  { q: "예수님의 어머니 이름은 무엇일까요?", a: ["마리아", "마르다", "엘리사벳", "사라"], c: 0, v: "누가복음 1장" },
  { q: "아기 예수님은 태어나서 어디에 누우셨을까요?", a: ["말구유", "침대", "요람", "소파"], c: 0, v: "누가복음 2장" },
  { q: "별을 따라와 아기 예수님께 선물을 드린 사람들은 누구일까요?", a: ["동방박사", "목자들", "제사장들", "군인들"], c: 0, v: "마태복음 2장" },
  { q: "요단강에서 예수님께 세례를 준 사람은 누구일까요?", a: ["세례 요한", "베드로", "안드레", "야고보"], c: 0, v: "마태복음 3장" },
  { q: "예수님의 제자는 모두 몇 명일까요?", a: ["12명", "7명", "10명", "40명"], c: 0, v: "마태복음 10장" },
  { q: "예수님은 떡 5개와 물고기 2마리로 몇 명을 먹이셨을까요?", a: ["오천 명", "백 명", "천 명", "오백 명"], c: 0, v: "마태복음 14장" },
  { q: "한 아이가 예수님께 드린 도시락에는 무엇이 들어 있었을까요?", a: ["떡 5개와 물고기 2마리", "빵 10개", "과일과 채소", "떡 2개와 물고기 5마리"], c: 0, v: "요한복음 6장" },
  { q: "예수님은 바다 위를 어떻게 지나가셨을까요?", a: ["물 위를 걸어가셨어요", "배를 타고 가셨어요", "헤엄쳐 가셨어요", "다리로 건너가셨어요"], c: 0, v: "마태복음 14장" },
  { q: "가나 혼인 잔치에서 예수님은 물을 무엇으로 바꾸셨을까요?", a: ["포도주", "우유", "꿀물", "주스"], c: 0, v: "요한복음 2장" },
  { q: "키가 작아서 예수님을 보려고 뽕나무에 올라간 사람은 누구일까요?", a: ["삭개오", "니고데모", "바디매오", "나사로"], c: 0, v: "누가복음 19장" },
  { q: "잃어버린 양 한 마리 이야기에서, 양은 원래 모두 몇 마리였을까요?", a: ["100마리", "10마리", "50마리", "1000마리"], c: 0, v: "누가복음 15장" },

  { id: "rainbow", name: "무지개",   price: 40, top: "#ff9de2", left: "#9d8bff", right: "#6fd8ff", sparkle: true },
];
const BLOCK_MAP = Object.fromEntries(BLOCK_TYPES.map(b => [b.id, b]));
const BUNDLE = 5; // 한 번 구매할 때 받는 블럭 수

/* =========================================================
   게임 상태
   ========================================================= */
const GRID = 10;     // 땅 크기 10x10
const MAX_H = 7;     // 최대 쌓기 높이
const SAVE_KEY = "bible-block-kingdom-v1";

let state = {
  coins: 30,
  inventory: { grass: 10, dirt: 10 },
  world: null,             // world[x][y] = 블럭 id 배열 (아래 -> 위)
  quizOrder: [],           // 섞인 퀴즈 순서
  quizPos: 0,
  streak: 0,
  helpSeen: false,
};

function newWorld() {
  return Array.from({ length: GRID }, () =>
    Array.from({ length: GRID }, () => []));
}

function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) { /* 저장 불가 환경 무시 */ }
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.world)) return false;
    state = Object.assign(state, data);
    return true;
  } catch (e) { return false; }
}

function shuffleQuizzes() {
  state.quizOrder = QUIZZES.map((_, i) => i);
  for (let i = state.quizOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.quizOrder[i], state.quizOrder[j]] = [state.quizOrder[j], state.quizOrder[i]];
  }
  state.quizPos = 0;
}

/* =========================================================
   효과음 (Web Audio - 외부 파일 없이 만든 소리)
   ========================================================= */
let audioCtx = null;
function tone(freq, dur, type, vol, delay) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur);
  } catch (e) { /* 소리 미지원 환경 무시 */ }
}
const sfx = {
  place:   () => tone(240, 0.09, "square", 0.10),
  remove:  () => tone(150, 0.12, "sawtooth", 0.10),
  buy:     () => { tone(660, 0.08, "square", 0.10); tone(880, 0.10, "square", 0.10, 0.08); },
  correct: () => { tone(523, 0.12, "square", 0.12); tone(659, 0.12, "square", 0.12, 0.10); tone(784, 0.2, "square", 0.12, 0.2); },
  wrong:   () => { tone(220, 0.2, "sawtooth", 0.10); tone(180, 0.25, "sawtooth", 0.10, 0.15); },
  bonus:   () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.14, "square", 0.12, i * 0.09)); },
};

/* =========================================================
   아이소메트릭 렌더링
   ========================================================= */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let view = { scale: 1, ox: 0, oy: 0, tileW: 72, tileH: 36, cubeH: 34 };
let hover = null; // { x, y } 마우스가 가리키는 칸
let dpr = 1;

function resize() {
  const wrap = document.getElementById("gameWrap");
  dpr = window.devicePixelRatio || 1;
  canvas.width = wrap.clientWidth * dpr;
  canvas.height = wrap.clientHeight * dpr;

  // 월드 전체가 화면에 들어오도록 스케일 계산
  const worldW = GRID * view.tileW;
  const worldH = GRID * view.tileH + MAX_H * view.cubeH;
  const sx = wrap.clientWidth / (worldW + 60);
  const sy = wrap.clientHeight / (worldH + 60);
  view.scale = Math.min(sx, sy, 1.6);
  view.ox = wrap.clientWidth / 2;
  view.oy = (wrap.clientHeight - (GRID * view.tileH - MAX_H * view.cubeH) * view.scale) / 2 + view.tileH * view.scale;
  draw();
}

// 격자 좌표 -> 화면 좌표 (칸 (x,y)의 높이 z 지점 다이아몬드 "북쪽 꼭짓점")
function isoPoint(x, y, z) {
  const px = view.ox + (x - y) * (view.tileW / 2) * view.scale;
  const py = view.oy + (x + y) * (view.tileH / 2) * view.scale - z * view.cubeH * view.scale;
  return { px, py };
}

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.min(255, Math.round(r * f)); g = Math.min(255, Math.round(g * f)); b = Math.min(255, Math.round(b * f));
  return `rgb(${r},${g},${b})`;
}

function drawCubeAt(px, py, type, s) {
  const hw = (view.tileW / 2) * s, hh = (view.tileH / 2) * s, ch = view.cubeH * s;
  const b = BLOCK_MAP[type];
  ctx.globalAlpha = b.alpha != null ? b.alpha : 1;

  // 윗면 (다이아몬드)
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + hw, py + hh);
  ctx.lineTo(px, py + hh * 2);
  ctx.lineTo(px - hw, py + hh);
  ctx.closePath();
  ctx.fillStyle = b.top; ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.lineWidth = 1; ctx.stroke();

  // 왼쪽 면
  ctx.beginPath();
  ctx.moveTo(px - hw, py + hh);
  ctx.lineTo(px, py + hh * 2);
  ctx.lineTo(px, py + hh * 2 + ch);
  ctx.lineTo(px - hw, py + hh + ch);
  ctx.closePath();
  ctx.fillStyle = b.left; ctx.fill(); ctx.stroke();

  // 오른쪽 면
  ctx.beginPath();
  ctx.moveTo(px + hw, py + hh);
  ctx.lineTo(px, py + hh * 2);
  ctx.lineTo(px, py + hh * 2 + ch);
  ctx.lineTo(px + hw, py + hh + ch);
  ctx.closePath();
  ctx.fillStyle = b.right; ctx.fill(); ctx.stroke();

  // 반짝이 효과 (금/다이아/무지개)
  if (b.sparkle) {
    ctx.fillStyle = "rgba(255,255,255,.9)";
    const dots = [[0, hh * 0.6], [-hw * 0.35, hh * 1.1], [hw * 0.4, hh * 1.2]];
    for (const [dx, dy] of dots) {
      ctx.beginPath();
      ctx.arc(px + dx, py + dy, 2.2 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawGroundTile(px, py, s, highlight) {
  const hw = (view.tileW / 2) * s, hh = (view.tileH / 2) * s;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + hw, py + hh);
  ctx.lineTo(px, py + hh * 2);
  ctx.lineTo(px - hw, py + hh);
  ctx.closePath();
  ctx.fillStyle = highlight ? "rgba(255, 230, 120, .85)" : "rgba(139, 195, 105, .55)";
  ctx.fill();
  ctx.strokeStyle = highlight ? "#ff9800" : "rgba(90, 130, 70, .5)";
  ctx.lineWidth = highlight ? 2.5 : 1;
  ctx.stroke();
}

function drawTopHighlight(px, py, s, removing) {
  const hw = (view.tileW / 2) * s, hh = (view.tileH / 2) * s;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + hw, py + hh);
  ctx.lineTo(px, py + hh * 2);
  ctx.lineTo(px - hw, py + hh);
  ctx.closePath();
  ctx.fillStyle = removing ? "rgba(255, 90, 90, .4)" : "rgba(255, 230, 120, .5)";
  ctx.fill();
  ctx.strokeStyle = removing ? "#e53935" : "#ff9800";
  ctx.lineWidth = 2.5;
  ctx.stroke();
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const s = view.scale;

  // 뒤에서 앞으로 그리기
  for (let sum = 0; sum <= (GRID - 1) * 2; sum++) {
    for (let x = 0; x < GRID; x++) {
      const y = sum - x;
      if (y < 0 || y >= GRID) continue;
      const stack = state.world[x][y];
      const base = isoPoint(x, y, 0);

      if (stack.length === 0) {
        drawGroundTile(base.px, base.py, s, hover && hover.x === x && hover.y === y && mode === "place");
      }
      for (let z = 0; z < stack.length; z++) {
        const p = isoPoint(x, y, z + 1); // 큐브 윗면 기준
        drawCubeAt(p.px, p.py, stack[z], s);
      }
      // 블럭이 있는 칸의 호버 표시 (맨 위 면)
      if (stack.length > 0 && hover && hover.x === x && hover.y === y) {
        const top = isoPoint(x, y, stack.length);
        drawTopHighlight(top.px, top.py, s, mode === "remove");
      }
    }
  }
}

// 화면 좌표 -> 격자 칸 찾기 (앞쪽 칸 우선)
// 블럭이 있는 칸은 맨 위 블럭의 윗면 + 옆면(실루엣)까지 클릭 판정
function pickCell(mx, my) {
  const s = view.scale;
  const hw = (view.tileW / 2) * s, hh = (view.tileH / 2) * s, ch = view.cubeH * s;

  for (let sum = (GRID - 1) * 2; sum >= 0; sum--) {
    for (let x = GRID - 1; x >= 0; x--) {
      const y = sum - x;
      if (y < 0 || y >= GRID) continue;
      const h = state.world[x][y].length;
      const top = isoPoint(x, y, h);
      const cx = top.px, cyc = top.py + hh; // 윗면 다이아몬드 중심
      const adx = Math.abs(mx - cx);
      if (adx > hw) continue;

      // 윗면 다이아몬드 판정
      if (adx / hw + Math.abs(my - cyc) / hh <= 1) return { x, y };

      // 옆면 판정 (블럭이 있을 때만): 윗면 아래 경계선에서 cubeH만큼 내려간 띠
      if (h > 0) {
        const lower = cyc + hh * (1 - adx / hw); // 윗면 아래쪽 경계
        if (my >= lower && my <= lower + ch) return { x, y };
      }
    }
  }
  return null;
}

/* =========================================================
   블럭 놓기 / 부수기
   ========================================================= */
let mode = "place";
let selectedBlock = "grass";

function placeBlock(x, y) {
  const stack = state.world[x][y];
  if (stack.length >= MAX_H) { toast("더 높이 쌓을 수 없어요! ⛰️"); return; }
  const count = state.inventory[selectedBlock] || 0;
  if (count <= 0) {
    toast(`${BLOCK_MAP[selectedBlock].name} 블럭이 없어요! 상점에서 사거나 퀴즈를 풀어요 📖`);
    return;
  }
  state.inventory[selectedBlock] = count - 1;
  stack.push(selectedBlock);
  sfx.place();
  save();
  renderPalette();
  draw();
}

function removeBlock(x, y) {
  const stack = state.world[x][y];
  if (stack.length === 0) return;
  const id = stack.pop();
  state.inventory[id] = (state.inventory[id] || 0) + 1;
  sfx.remove();
  save();
  renderPalette();
  draw();
}

function onCanvasClick(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX !== undefined ? e.clientX : e.touches[0].clientX) - rect.left;
  const my = (e.clientY !== undefined ? e.clientY : e.touches[0].clientY) - rect.top;
  const cell = pickCell(mx, my);
  if (!cell) return;
  if (mode === "place") placeBlock(cell.x, cell.y);
  else removeBlock(cell.x, cell.y);
}

canvas.addEventListener("click", onCanvasClick);
canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  hover = pickCell(e.clientX - rect.left, e.clientY - rect.top);
  draw();
});
canvas.addEventListener("mouseleave", () => { hover = null; draw(); });
// 우클릭 = 부수기 단축
canvas.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const cell = pickCell(e.clientX - rect.left, e.clientY - rect.top);
  if (cell) removeBlock(cell.x, cell.y);
});

/* =========================================================
   모드 버튼
   ========================================================= */
const placeModeBtn = document.getElementById("placeModeBtn");
const removeModeBtn = document.getElementById("removeModeBtn");
function setMode(m) {
  mode = m;
  placeModeBtn.classList.toggle("active", m === "place");
  removeModeBtn.classList.toggle("active", m === "remove");
  draw();
}
placeModeBtn.addEventListener("click", () => setMode("place"));
removeModeBtn.addEventListener("click", () => setMode("remove"));

/* =========================================================
   블럭 팔레트 (상점 + 인벤토리)
   ========================================================= */
const paletteEl = document.getElementById("palette");

function drawMiniCube(cv, type) {
  const c = cv.getContext("2d");
  const W = cv.width = 88, H = cv.height = 88;
  c.clearRect(0, 0, W, H);
  const b = BLOCK_MAP[type];
  const hw = 34, hh = 17, ch = 30, px = W / 2, py = 12;
  c.globalAlpha = b.alpha != null ? b.alpha : 1;
  // 윗면
  c.beginPath(); c.moveTo(px, py); c.lineTo(px + hw, py + hh); c.lineTo(px, py + hh * 2); c.lineTo(px - hw, py + hh); c.closePath();
  c.fillStyle = b.top; c.fill(); c.strokeStyle = "rgba(0,0,0,.2)"; c.stroke();
  // 왼쪽
  c.beginPath(); c.moveTo(px - hw, py + hh); c.lineTo(px, py + hh * 2); c.lineTo(px, py + hh * 2 + ch); c.lineTo(px - hw, py + hh + ch); c.closePath();
  c.fillStyle = b.left; c.fill(); c.stroke();
  // 오른쪽
  c.beginPath(); c.moveTo(px + hw, py + hh); c.lineTo(px, py + hh * 2); c.lineTo(px, py + hh * 2 + ch); c.lineTo(px + hw, py + hh + ch); c.closePath();
  c.fillStyle = b.right; c.fill(); c.stroke();
  if (b.sparkle) {
    c.fillStyle = "#fff";
    [[0, 20], [-14, 40], [16, 44]].forEach(([dx, dy]) => {
      c.beginPath(); c.arc(px + dx, py + dy, 3, 0, Math.PI * 2); c.fill();
    });
  }
  c.globalAlpha = 1;
}

function renderPalette() {
  paletteEl.innerHTML = "";
  for (const b of BLOCK_TYPES) {
    const count = state.inventory[b.id] || 0;
    const card = document.createElement("div");
    card.className = "block-card" + (selectedBlock === b.id ? " selected" : "");
    card.title = `${b.name} 블럭`;

    const cnt = document.createElement("span");
    cnt.className = "bcount" + (count === 0 ? " zero" : "");
    cnt.textContent = count;
    card.appendChild(cnt);

    const cv = document.createElement("canvas");
    drawMiniCube(cv, b.id);
    card.appendChild(cv);

    const nm = document.createElement("div");
    nm.className = "bname";
    nm.textContent = b.name;
    card.appendChild(nm);

    const buy = document.createElement("button");
    buy.className = "buy-btn";
    buy.textContent = `${BUNDLE}개 사기 🪙${b.price}`;
    buy.disabled = state.coins < b.price;
    buy.addEventListener("click", (e) => {
      e.stopPropagation();
      buyBlock(b.id);
    });
    card.appendChild(buy);

    card.addEventListener("click", () => {
      selectedBlock = b.id;
      setMode("place");
      renderPalette();
    });
    paletteEl.appendChild(card);
  }
}

function buyBlock(id) {
  const b = BLOCK_MAP[id];
  if (state.coins < b.price) { toast("코인이 부족해요! 퀴즈를 풀어 보세요 📖"); return; }
  state.coins -= b.price;
  state.inventory[id] = (state.inventory[id] || 0) + BUNDLE;
  selectedBlock = id;
  sfx.buy();
  save();
  updateCoins();
  renderPalette();
}

/* =========================================================
   코인 표시
   ========================================================= */
const coinBox = document.getElementById("coinBox");
const coinCount = document.getElementById("coinCount");
function updateCoins() {
  coinCount.textContent = state.coins;
  coinBox.classList.remove("bump");
  void coinBox.offsetWidth; // 애니메이션 재시작
  coinBox.classList.add("bump");
}

function flyCoin(text) {
  const el = document.createElement("div");
  el.className = "coin-fly";
  el.textContent = text;
  const r = coinBox.getBoundingClientRect();
  el.style.left = (r.left + r.width / 2 - 20) + "px";
  el.style.top = (r.bottom + 8) + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}

function toast(msg) {
  const el = document.createElement("div");
  el.className = "coin-fly";
  el.style.left = "50%";
  el.style.top = "40%";
  el.style.transform = "translateX(-50%)";
  el.style.fontSize = "18px";
  el.style.color = "#fff";
  el.style.textShadow = "0 0 6px rgba(0,0,0,.6)";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}

/* =========================================================
   퀴즈
   ========================================================= */
const quizModal = document.getElementById("quizModal");
const quizQuestion = document.getElementById("quizQuestion");
const quizAnswers = document.getElementById("quizAnswers");
const quizFeedback = document.getElementById("quizFeedback");
const quizVerse = document.getElementById("quizVerse");
const streakBox = document.getElementById("streakBox");
const nextQuizBtn = document.getElementById("nextQuizBtn");

const REWARD = 10;        // 정답 보상
const STREAK_BONUS = 5;   // 3연속 정답 보너스
const CONSOLATION = 1;    // 오답 참가상

let currentQuiz = null;
let answered = false;

function openQuiz() {
  quizModal.classList.remove("hidden");
  nextQuiz();
}

function nextQuiz() {
  if (state.quizPos >= state.quizOrder.length) shuffleQuizzes();
  currentQuiz = QUIZZES[state.quizOrder[state.quizPos]];
  state.quizPos++;
  answered = false;

  quizQuestion.textContent = currentQuiz.q;
  quizFeedback.textContent = "";
  quizVerse.textContent = "";
  streakBox.textContent = state.streak >= 2 ? `🔥 ${state.streak}문제 연속 정답 중!` : "";
  nextQuizBtn.classList.add("hidden");
  quizAnswers.innerHTML = "";

  // 보기 섞기
  const order = currentQuiz.a.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  const labels = ["①", "②", "③", "④"];
  order.forEach((ai, idx) => {
    const btn = document.createElement("button");
    btn.className = "answer-btn";
    btn.textContent = `${labels[idx]} ${currentQuiz.a[ai]}`;
    btn.addEventListener("click", () => answerQuiz(btn, ai));
    quizAnswers.appendChild(btn);
  });
}

function answerQuiz(btn, ai) {
  if (answered) return;
  answered = true;
  const correct = ai === currentQuiz.c;
  const btns = [...quizAnswers.children];
  btns.forEach((b) => (b.disabled = true));

  // 정답 표시
  btns.forEach((b) => {
    if (b.textContent.slice(2).trim() === currentQuiz.a[currentQuiz.c]) b.classList.add("correct");
  });

  if (correct) {
    state.streak++;
    let earned = REWARD;
    if (state.streak > 0 && state.streak % 3 === 0) {
      earned += STREAK_BONUS;
      quizFeedback.textContent = `🎉 정답! 3연속 보너스까지 +${earned}코인!`;
      sfx.bonus();
    } else {
      quizFeedback.textContent = `⭕ 딩동댕~ 정답이에요! +${REWARD}코인`;
      sfx.correct();
    }
    quizFeedback.style.color = "#2e8b26";
    state.coins += earned;
    flyCoin(`+${earned} 🪙`);
  } else {
    btn.classList.add("wrong");
    state.streak = 0;
    state.coins += CONSOLATION;
    quizFeedback.textContent = `❌ 아쉬워요! 정답은 "${currentQuiz.a[currentQuiz.c]}" (참가상 +${CONSOLATION}코인)`;
    quizFeedback.style.color = "#c0392b";
    sfx.wrong();
  }
  quizVerse.textContent = `📖 ${currentQuiz.v}`;
  streakBox.textContent = state.streak >= 2 ? `🔥 ${state.streak}문제 연속 정답 중!` : "";
  nextQuizBtn.classList.remove("hidden");
  save();
  updateCoins();
  renderPalette(); // 살 수 있는 블럭 갱신
}

document.getElementById("quizOpenBtn").addEventListener("click", openQuiz);
nextQuizBtn.addEventListener("click", nextQuiz);
document.getElementById("closeQuizBtn").addEventListener("click", () => quizModal.classList.add("hidden"));

/* =========================================================
   도움말 / 초기화
   ========================================================= */
const helpModal = document.getElementById("helpModal");
document.getElementById("helpBtn").addEventListener("click", () => helpModal.classList.remove("hidden"));
document.getElementById("closeHelpBtn").addEventListener("click", () => {
  helpModal.classList.add("hidden");
  state.helpSeen = true;
  save();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("정말 처음부터 다시 시작할까요?\n(쌓은 블럭과 코인이 모두 사라져요)")) return;
  localStorage.removeItem(SAVE_KEY);
  state = {
    coins: 30,
    inventory: { grass: 10, dirt: 10 },
    world: newWorld(),
    quizOrder: [], quizPos: 0, streak: 0, helpSeen: true,
  };
  shuffleQuizzes();
  save();
  updateCoins();
  renderPalette();
  draw();
});

/* =========================================================
   구름 장식
   ========================================================= */
function makeClouds() {
  const wrap = document.getElementById("gameWrap");
  for (let i = 0; i < 4; i++) {
    const c = document.createElement("div");
    c.className = "cloud";
    const w = 90 + Math.random() * 90;
    c.style.width = w + "px";
    c.style.height = w * 0.32 + "px";
    c.style.top = 5 + Math.random() * 25 + "%";
    c.style.animationDuration = 40 + Math.random() * 40 + "s";
    c.style.animationDelay = -Math.random() * 60 + "s";
    wrap.appendChild(c);
  }
}

/* =========================================================
   시작
   ========================================================= */
function init() {
  const loaded = load();
  if (!loaded || !state.world) state.world = newWorld();
  if (!state.quizOrder || state.quizOrder.length === 0) shuffleQuizzes();

  updateCoins();
  renderPalette();
  makeClouds();
  resize();
  window.addEventListener("resize", resize);

  if (!state.helpSeen) helpModal.classList.remove("hidden");
}
init();
</script>
